openapi: 3.1.0
info:
  title: Earmark Institution API
  version: 1.0.0
  description: |
    Connected mode for schools and other institutions. An institution signs a structured invoice with its Ed25519
    key and posts it here. Earmark verifies the signature against the public registry, runs the deterministic policy
    gate (rules R01–R17), and only then lets the Guardian propose a payment. The payout always goes to the account in
    the registry, never to an account named on an invoice. Sandbox only; all names are fictional.
servers:
  - url: /
paths:
  /api/institution/registry:
    get:
      summary: Public registry of institutions and their signing keys
      responses:
        "200":
          description: Registry entries (payout accounts are not published)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, verified, publicKey]
                      properties:
                        id: { type: string, example: ins_lakeview }
                        name: { type: string, example: Lakeview Secondary School }
                        verified: { type: boolean }
                        publicKey: { type: [string, "null"], description: base64 of an Ed25519 SPKI PEM }
  /api/institution/invoices:
    post:
      summary: Submit a signed invoice
      description: |
        `signature` = base64(Ed25519 signature over the canonical JSON of `payload`: keys sorted, no whitespace).
        `keyId` must equal `payload.institutionId`. A duplicate (same canonical payload, or same institution +
        invoice number) returns 409. An invalid signature returns 201 with verdict BLOCK and rule R12, and is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignedInvoiceWire" }
      responses:
        "201":
          description: Evaluated. If every rule passed, the Guardian proposed and the orchestrator paid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitResult" }
        "400": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Unknown earmarkRef, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Duplicate invoice (R09), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Rate limited, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/institution/invoices/{id}:
    get:
      summary: Status of a submitted invoice
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      invoiceId: { type: string }
                      invoiceNumber: { type: [string, "null"] }
                      amountMinor: { type: [integer, "null"] }
                      currency: { type: [string, "null"] }
                      verdict: { type: string, enum: [ALLOW, BLOCK, REQUIRE_APPROVAL, PENDING] }
                      reasons: { type: array, items: { $ref: "#/components/schemas/RuleResult" } }
                      paid: { type: boolean }
                      paymentStatus: { type: [string, "null"], enum: [pending, captured, paid_out, failed, null] }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
components:
  schemas:
    SignedInvoicePayload:
      type: object
      required: [v, institutionId, invoiceNumber, earmarkRef, studentName, lineItems, totalMinor, currency, payoutAccount, issuedAt, dueDate]
      properties:
        v: { type: integer, const: 1 }
        institutionId: { type: string, example: ins_lakeview }
        invoiceNumber: { type: string, example: LSS-T1-1001 }
        earmarkRef: { type: string, description: The Earmark id the institution was given, example: em_demo }
        studentName: { type: string, example: Brian Kamau }
        description: { type: string, example: Term 1 2027 school fees }
        lineItems:
          type: array
          minItems: 1
          items:
            type: object
            required: [label, amountMinor]
            properties:
              label: { type: string, example: Tuition }
              amountMinor: { type: integer, minimum: 0, description: cents, example: 25000 }
        totalMinor: { type: integer, minimum: 1, description: cents; must equal the sum of lineItems (R14), example: 35000 }
        currency: { type: string, const: USD }
        payoutAccount: { type: string, format: email, description: Compared with the registry (R05); never used as the payout destination }
        issuedAt: { type: string, format: date-time }
        dueDate: { type: string, example: "2026-12-10" }
    SignedInvoiceWire:
      type: object
      required: [payload, signature, keyId]
      properties:
        payload: { $ref: "#/components/schemas/SignedInvoicePayload" }
        signature: { type: string, description: base64 Ed25519 signature over canonical JSON of payload }
        keyId: { type: string, example: ins_lakeview }
    RuleResult:
      type: object
      required: [ruleId, status, title, reason]
      properties:
        ruleId: { type: string, example: R05_PAYOUT_ACCOUNT_MATCH }
        status: { type: string, enum: [pass, fail, warn, skip] }
        title: { type: string }
        reason: { type: string }
        expected: { type: string }
        actual: { type: string }
    SubmitResult:
      type: object
      properties:
        ok: { type: boolean, const: true }
        data:
          type: object
          properties:
            invoiceId: { type: [string, "null"], description: null when the invoice was not stored (bad signature) }
            signatureValid: { type: boolean }
            verdict: { type: string, enum: [ALLOW, BLOCK, REQUIRE_APPROVAL] }
            firstBlocking: { type: [string, "null"] }
            results: { type: array, items: { $ref: "#/components/schemas/RuleResult" } }
            guardian:
              type: [object, "null"]
              properties:
                outcome: { type: string, enum: [ticket, approval_requested, blocked, hold_missing, no_action, error] }
                message: { type: string }
            payment:
              type: [object, "null"]
              properties:
                paymentId: { type: string }
                status: { type: string }
                amountMinor: { type: integer }
                payoutConfirmed: { type: boolean }
    Error:
      type: object
      properties:
        ok: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string, enum: [VALIDATION, NOT_FOUND, INVALID_STATE, CONFLICT_DUPLICATE, POLICY_BLOCKED, PAYPAL_ERROR, AI_ERROR, RATE_LIMITED, FROZEN] }
            message: { type: string }
            detail: { type: object }
